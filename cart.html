<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Bloom Garden</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold text-danger" href="index.html">
            Bloom Garden
        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="flowers.html">Flowers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="cart.html">
                        Cart 🛒
                        <span id="cart-count" class="badge bg-danger">0</span>
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- Page Title -->

<section class="container py-5">

    <h1 class="text-center mb-4">
        Shopping Cart
    </h1>

    <div class="table-responsive">

        <table class="table table-bordered align-middle">

            <thead class="table-danger">

                <tr>
                    <th>Flower</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="cart-items">

                <!-- JavaScript loads cart items here -->

            </tbody>

        </table>

    </div>

    <div class="text-end mt-4">

        <h3>
            Total :
            <span class="text-danger">
                Rs.
                <span id="cart-total">0</span>
            </span>
        </h3>

        <button class="btn btn-success mt-3"
                onclick="checkout()">
            Proceed to Checkout
        </button>

        <button class="btn btn-outline-danger mt-3 ms-2"
                onclick="clearCart()">
            Clear Cart
        </button>

    </div>

</section>

<footer class="bg-dark text-white text-center p-4 mt-5">

    <p>
        © 2026 Bloom Garden Flower Shop
    </p>

</footer>

<script src="js/script.js"></script>

<script>
displayCart();
updateCartCount();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
